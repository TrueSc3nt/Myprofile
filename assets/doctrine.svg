<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="120" viewBox="0 0 1080 120" role="img" aria-label="Doctrine">
  <rect width="1080" height="120" rx="3" fill="#0a0e11" stroke="#243038" stroke-width="1"/>
  <text x="28" y="32" fill="#6e7a72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3">DOCTRINE</text>
  <text x="28" y="62" fill="#e8e2d4" font-family="Georgia, 'Times New Roman', serif" font-size="18">Search what you are authorized to search.</text>
  <text x="28" y="92" fill="#9aa79c" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic">Full 256-bit space is not a treasure map  it is a horizon.</text>
</svg>
