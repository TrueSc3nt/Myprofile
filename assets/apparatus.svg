<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="168" viewBox="0 0 1080 168" role="img" aria-label="Apparatus  stack and search modes">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1216"/>
      <stop offset="100%" stop-color="#0a0e11"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="168" rx="3" fill="url(#panel)" stroke="#243038" stroke-width="1"/>

  <text x="28" y="34" fill="#6e7a72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3">APPARATUS</text>

  <!-- left column: metals -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="28" y="68" fill="#e0c184" font-size="13" letter-spacing="1">C / C++</text>
    <text x="28" y="92" fill="#c9d0c8" font-size="13" letter-spacing="1">CUDA · SIMD</text>
    <text x="28" y="116" fill="#c9d0c8" font-size="13" letter-spacing="1">CMake · Python</text>
    <text x="28" y="140" fill="#8fb9a8" font-size="13" letter-spacing="1">secp256k1 · ed25519</text>
  </g>

  <line x1="270" y1="28" x2="270" y2="148" stroke="#243038" stroke-width="1"/>

  <!-- modes as engraved plates -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <rect x="302" y="48" width="170" height="34" rx="2" fill="#12181c" stroke="#3a4a42"/>
    <text x="387" y="69" text-anchor="middle" fill="#ddd8c8" letter-spacing="2">BSGS</text>

    <rect x="488" y="48" width="170" height="34" rx="2" fill="#12181c" stroke="#3a4a42"/>
    <text x="573" y="69" text-anchor="middle" fill="#ddd8c8" letter-spacing="2">KANGAROO</text>

    <rect x="674" y="48" width="170" height="34" rx="2" fill="#12181c" stroke="#3a4a42"/>
    <text x="759" y="69" text-anchor="middle" fill="#ddd8c8" letter-spacing="2">VANITY</text>

    <rect x="860" y="48" width="190" height="34" rx="2" fill="#12181c" stroke="#c9a66b" stroke-opacity="0.7"/>
    <text x="955" y="69" text-anchor="middle" fill="#e0c184" letter-spacing="2">MULTI-COIN</text>

    <rect x="302" y="98" width="170" height="34" rx="2" fill="#12181c" stroke="#3a4a42"/>
    <text x="387" y="119" text-anchor="middle" fill="#ddd8c8" letter-spacing="2">ADDRESS</text>

    <rect x="488" y="98" width="170" height="34" rx="2" fill="#12181c" stroke="#3a4a42"/>
    <text x="573" y="119" text-anchor="middle" fill="#ddd8c8" letter-spacing="2">PUBKEY DL</text>

    <rect x="674" y="98" width="170" height="34" rx="2" fill="#12181c" stroke="#3a4a42"/>
    <text x="759" y="119" text-anchor="middle" fill="#ddd8c8" letter-spacing="2">BIP39</text>

    <rect x="860" y="98" width="190" height="34" rx="2" fill="#12181c" stroke="#3a4a42"/>
    <text x="955" y="119" text-anchor="middle" fill="#ddd8c8" letter-spacing="2">BRAINWALLET</text>
  </g>
</svg>
